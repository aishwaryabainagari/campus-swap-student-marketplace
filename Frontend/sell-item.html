<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sell an Item | Campus Swap</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <div class="logo">
            <h1>Campus<span>Swap</span></h1>
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="index.html#categories">Categories</a>
            <a href="sell-item.html">Sell an Item</a>
            <a href="dashboard.html">Dashboard</a>
        </nav>

        <div class="auth-buttons" id="auth-buttons">
            <a href="login.html" class="login-btn" id="header-login">
                Login
            </a>

            <a href="register.html" class="register-btn" id="header-register">
                Register
            </a>

            <a href="dashboard.html" class="login-btn"
               id="header-dashboard" style="display: none;">
                Dashboard
            </a>

            <button type="button" class="logout-btn"
                    id="header-logout" style="display: none;">
                Logout
            </button>
        </div>
    </header>

    <main class="auth-page">
        <section class="auth-card sell-card">

            <div class="auth-heading">
                <h2>List Your Item</h2>
                <p>Help fellow students find what they need.</p>
            </div>

            <form id="sell-form">

                <div class="form-group">
                    <label for="item-name">Item Name</label>
                    <input
                        type="text"
                        id="item-name"
                        name="itemName"
                        placeholder="Example: Engineering Mathematics Book"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="item-category">Category</label>
                    <select id="item-category" name="category" required>
                        <option value="">Select a category</option>
                        <option value="Books">Books</option>
                        <option value="Calculators">Calculators</option>
                        <option value="Class Notes">Class Notes</option>
                        <option value="Previous Year Question Papers">
                            Previous Year Question Papers
                        </option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="item-price">Price (₹)</label>
                    <input
                        type="number"
                        id="item-price"
                        name="price"
                        placeholder="Enter your price"
                        min="0"
                        step="1"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="item-condition">Item Condition</label>
                    <select id="item-condition" name="condition" required>
                        <option value="">Select condition</option>
                        <option value="New">New</option>
                        <option value="Like New">Like New</option>
                        <option value="Good">Good</option>
                        <option value="Fair">Fair</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="item-description">Description</label>
                    <textarea
                        id="item-description"
                        name="description"
                        rows="4"
                        placeholder="Describe your item..."
                        required
                    ></textarea>
                </div>

                <div class="form-group">
                    <label for="seller-name">Your Name</label>
                    <input
                        type="text"
                        id="seller-name"
                        name="sellerName"
                        placeholder="Enter your name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="seller-email">College Email</label>
                    <input
                        type="email"
                        id="seller-email"
                        name="sellerEmail"
                        placeholder="Enter your college email"
                        required
                    >
                </div>

                <button type="submit" class="auth-submit-btn">
                    Submit Item
                </button>

                <p id="sell-message" role="status" aria-live="polite"></p>

            </form>

        </section>
    </main>

    <footer>
        <h2>CampusSwap</h2>
        <p>A smarter way for students to buy, sell and exchange.</p>

        <div class="footer-links">
            <a href="index.html">Home</a>
            <a href="register.html">Join Us</a>
            <a href="sell-item.html">Sell an Item</a>
        </div>

        <p class="copyright">
            &copy; 2026 Campus Swap. All rights reserved.
        </p>
    </footer>

    <script src="js/app.js"></script>
    <script src="js/sell-item.js"></script>
    <script src="js/header.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/sell-item.js"></script>

</body>
</html>
